<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f12" />
    <title>Offline – HD HOTELS TECHNIK</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #0d0f12;
        color: #e8e6e1;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 26rem;
        border: 1px solid #22262e;
        border-radius: 14px;
        background: #14171c;
        padding: 2rem 1.5rem;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.25rem; letter-spacing: -0.01em; }
      p { margin: 0; color: #9b9a97; font-size: 0.9rem; line-height: 1.6; }
      .mark {
        display: inline-grid;
        place-items: center;
        width: 3rem; height: 3rem;
        margin-bottom: 1rem;
        border-radius: 12px;
        background: rgba(226, 180, 106, 0.12);
        color: #e2b46a;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="mark">HD</span>
      <h1>Keine Verbindung</h1>
      <p>
        Die Meldungen und Fotos werden aus Sicherheitsgründen nicht offline gespeichert.
        Sobald wieder Netz verfügbar ist, lädt die App normal weiter.
      </p>
    </div>
  </body>
</html>
